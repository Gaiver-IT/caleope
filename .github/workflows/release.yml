name: Build & Release

on:
  push:
    branches: [main, alpha]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: module/go.mod
          cache-dependency-path: module/go.sum

      - name: Déterminer version et canal
        id: meta
        run: |
          BRANCH="${GITHUB_REF_NAME}"
          SHORT_SHA="${GITHUB_SHA::7}"

          if [[ "${BRANCH}" == "alpha" ]]; then
            echo "version=alpha-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
            echo "tag=alpha-latest"           >> "$GITHUB_OUTPUT"
            echo "title=Caleope alpha (${SHORT_SHA})" >> "$GITHUB_OUTPUT"
          else
            VERSION=$(grep 'Version = ' module/pkg/version/version.go \
              | sed 's/.*"\(.*\)".*/\1/' | tr -d ' ')
            [[ -z "${VERSION}" || "${VERSION}" == "dev" ]] && VERSION="v0.0.0"
            echo "version=${VERSION}"         >> "$GITHUB_OUTPUT"
            echo "tag=${VERSION}"             >> "$GITHUB_OUTPUT"
            echo "title=Caleope ${VERSION}"   >> "$GITHUB_OUTPUT"
          fi

      - name: Build binaires linux/amd64
        working-directory: module
        env:
          GOOS: linux
          GOARCH: amd64
          CGO_ENABLED: "0"
        run: |
          VERSION="${{ steps.meta.outputs.version }}"
          COMMIT="${GITHUB_SHA::7}"
          LDFLAGS="-s -w -X github.com/gaiver-it/caleope/pkg/version.Version=${VERSION} -X github.com/gaiver-it/caleope/pkg/version.Commit=${COMMIT}"
          mkdir -p ../dist
          go build -ldflags "${LDFLAGS}" -o ../dist/caleoped-linux-amd64    ./cmd/caleoped/
          go build -ldflags "${LDFLAGS}" -o ../dist/caleope-linux-amd64     ./cmd/caleope/
          go build -ldflags "${LDFLAGS}" -o ../dist/caleope-ui-linux-amd64  ./cmd/caleope-ui/

      # ── L'exécutable des postes nomades ─────────────────────────────────
      # Il ne tourne PAS sur le serveur : c'est celui qu'on installe sur son
      # Mac, son Ubuntu, son Windows. Il est donc compilé pour les trois, et
      # publié avec le reste — sinon il faudrait le construire à la main pour
      # chaque machine, ce qui ruine l'idée d'« un exécutable à installer ».
      - name: Build de l'exécutable poste (3 systèmes)
        working-directory: module
        env:
          CGO_ENABLED: "0"
        run: |
          VERSION="${{ steps.meta.outputs.version }}"
          COMMIT="${GITHUB_SHA::7}"
          LDFLAGS="-s -w -X github.com/gaiver-it/caleope/pkg/version.Version=${VERSION} -X github.com/gaiver-it/caleope/pkg/version.Commit=${COMMIT}"
          mkdir -p ../dist
          GOOS=linux   GOARCH=amd64 go build -ldflags "${LDFLAGS}" -o ../dist/poste-linux-amd64       ./cmd/poste/
          GOOS=darwin  GOARCH=arm64 go build -ldflags "${LDFLAGS}" -o ../dist/poste-macos-arm64       ./cmd/poste/
          GOOS=darwin  GOARCH=amd64 go build -ldflags "${LDFLAGS}" -o ../dist/poste-macos-amd64       ./cmd/poste/
          GOOS=windows GOARCH=amd64 go build -ldflags "${LDFLAGS}" -o ../dist/poste-windows-amd64.exe ./cmd/poste/

      - name: Publier la release GitHub
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.meta.outputs.tag }}
          TITLE: ${{ steps.meta.outputs.title }}
        run: |
          ASSETS="dist/caleoped-linux-amd64 dist/caleope-linux-amd64 dist/caleope-ui-linux-amd64 dist/poste-linux-amd64 dist/poste-macos-arm64 dist/poste-macos-amd64 dist/poste-windows-amd64.exe"

          if gh release view "${TAG}" &>/dev/null; then
            # Release existante — remplacer les assets sans interruption (pas de delete)
            # Évite le window où la release n'a aucun asset pendant la reconstruction
            for asset in ${ASSETS}; do
              gh release upload "${TAG}" "${asset}" --clobber
            done
            # Pour alpha-latest : mettre à jour le titre avec le nouveau commit
            if [[ "${TAG}" == "alpha-latest" ]]; then
              gh release edit "${TAG}" --title "${TITLE}"
            fi
          else
            gh release create "${TAG}" \
              --title "${TITLE}" \
              --notes "" \
              ${ASSETS}
          fi
