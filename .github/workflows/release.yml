name: Build & Release

on:
  push:
    branches: [main, alpha]

permissions:
  contents: write

jobs:
  # ── macOS : le bundle DOIT être assemblé puis signé sur un Mac ─────────────
  # Le job Linux ne peut pas s'en charger : codesign n'existe que sur macOS, et
  # un bundle .app dont la signature ne couvre pas la structure est refusé par
  # le système à l'ouverture — « l'application est endommagée », sans possibilité
  # de passer outre. C'est exactement ce qui est arrivé en v0.9.15 : le binaire
  # était signé par l'éditeur de liens Go, mais l'enveloppe .app ajoutée APRÈS
  # laissait spctl répondre « code has no resources but signature indicates they
  # must be present ».
  bundle-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: module/go.mod
          cache-dependency-path: module/go.sum

      - name: Version
        id: v
        run: echo "version=$(grep -oE 'v[0-9]+\.[0-9]+\.[0-9]+' module/pkg/version/version.go | head -1)" >> "$GITHUB_OUTPUT"

      - name: Construire et signer les bundles
        run: |
          set -euo pipefail
          mkdir -p dist
          cd module
          LDFLAGS="-s -w -X github.com/gaiver-it/caleope/pkg/version.Version=${{ steps.v.outputs.version }}"
          for arch in arm64 amd64; do
            GOOS=darwin GOARCH=$arch go build -ldflags "${LDFLAGS}" -o ../dist/poste-bureau-macos-$arch ./cmd/poste-bureau/
            GOOS=darwin GOARCH=$arch go build -ldflags "${LDFLAGS}" -o ../dist/poste-macos-$arch        ./cmd/poste/
          done
          bash cmd/poste-bureau/paquetage/empaqueter.sh ../dist "${{ steps.v.outputs.version }}"

      - name: Vérifier la signature (une release non vérifiée ne vaut rien)
        run: |
          set -euo pipefail
          cd dist
          for z in Poste-macos-*.app.zip; do
            rm -rf ctrl && mkdir ctrl && (cd ctrl && unzip -qo "../$z")
            APP=$(find ctrl -maxdepth 1 -name '*.app')
            test -f "$APP/Contents/_CodeSignature/CodeResources" \
              || { echo "::error::$z : signature du bundle absente"; exit 1; }
            codesign --verify --deep --strict -v "$APP"
            echo "✓ $z"
          done
          rm -rf ctrl

      - uses: actions/upload-artifact@v4
        with:
          name: bundles-macos
          path: |
            dist/Poste-macos-*.app.zip
            dist/poste-bureau-macos-*
            dist/poste-macos-*

  build:
    runs-on: ubuntu-latest
    needs: bundle-macos
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: module/go.mod
          cache-dependency-path: module/go.sum

      - name: Déterminer version et canal
        id: meta
        run: |
          BRANCH="${GITHUB_REF_NAME}"
          SHORT_SHA="${GITHUB_SHA::7}"

          if [[ "${BRANCH}" == "alpha" ]]; then
            echo "version=alpha-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
            echo "tag=alpha-latest"           >> "$GITHUB_OUTPUT"
            echo "title=Caleope alpha (${SHORT_SHA})" >> "$GITHUB_OUTPUT"
          else
            VERSION=$(grep 'Version = ' module/pkg/version/version.go \
              | sed 's/.*"\(.*\)".*/\1/' | tr -d ' ')
            [[ -z "${VERSION}" || "${VERSION}" == "dev" ]] && VERSION="v0.0.0"
            echo "version=${VERSION}"         >> "$GITHUB_OUTPUT"
            echo "tag=${VERSION}"             >> "$GITHUB_OUTPUT"
            echo "title=Caleope ${VERSION}"   >> "$GITHUB_OUTPUT"
          fi

      - name: Build binaires linux/amd64
        working-directory: module
        env:
          GOOS: linux
          GOARCH: amd64
          CGO_ENABLED: "0"
        run: |
          VERSION="${{ steps.meta.outputs.version }}"
          COMMIT="${GITHUB_SHA::7}"
          LDFLAGS="-s -w -X github.com/gaiver-it/caleope/pkg/version.Version=${VERSION} -X github.com/gaiver-it/caleope/pkg/version.Commit=${COMMIT}"
          mkdir -p ../dist
          go build -ldflags "${LDFLAGS}" -o ../dist/caleoped-linux-amd64    ./cmd/caleoped/
          go build -ldflags "${LDFLAGS}" -o ../dist/caleope-linux-amd64     ./cmd/caleope/
          go build -ldflags "${LDFLAGS}" -o ../dist/caleope-ui-linux-amd64  ./cmd/caleope-ui/

      # ── L'exécutable des postes nomades ─────────────────────────────────
      # Il ne tourne PAS sur le serveur : c'est celui qu'on installe sur son
      # Mac, son Ubuntu, son Windows. Il est donc compilé pour les trois, et
      # publié avec le reste — sinon il faudrait le construire à la main pour
      # chaque machine, ce qui ruine l'idée d'« un exécutable à installer ».
      - name: Build de l'exécutable poste (3 systèmes)
        working-directory: module
        env:
          CGO_ENABLED: "0"
        run: |
          VERSION="${{ steps.meta.outputs.version }}"
          COMMIT="${GITHUB_SHA::7}"
          LDFLAGS="-s -w -X github.com/gaiver-it/caleope/pkg/version.Version=${VERSION} -X github.com/gaiver-it/caleope/pkg/version.Commit=${COMMIT}"
          mkdir -p ../dist
          GOOS=linux   GOARCH=amd64 go build -ldflags "${LDFLAGS}" -o ../dist/poste-linux-amd64       ./cmd/poste/
          # Les cibles macOS sont construites ET SIGNÉES par le job bundle-macos :
          # un binaire darwin produit ici ne pourrait pas l'être, et un bundle non
          # signé est refusé à l'ouverture.
          GOOS=windows GOARCH=amd64 go build -ldflags "${LDFLAGS}" -o ../dist/poste-windows-amd64.exe ./cmd/poste/
          # La fenêtre : même logique, autre interface.
          GOOS=linux   GOARCH=amd64 go build -ldflags "${LDFLAGS}" -o ../dist/poste-bureau-linux-amd64       ./cmd/poste-bureau/
          GOOS=windows GOARCH=amd64 go build -ldflags "${LDFLAGS}" -o ../dist/poste-bureau-windows-amd64.exe ./cmd/poste-bureau/
          # Le raccourci Linux est engendré ICI : il est produit sur le runner
          # macOS aussi, mais n'y est pas téléversé — et le chercher dans un
          # artefact d'un autre job pour un simple fichier texte serait absurde.
          bash cmd/poste-bureau/paquetage/empaqueter.sh ../dist "${VERSION}"

      - name: Récupérer les bundles signés sur macOS
        uses: actions/download-artifact@v4
        with:
          name: bundles-macos
          path: dist

      - name: Publier la release GitHub
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.meta.outputs.tag }}
          TITLE: ${{ steps.meta.outputs.title }}
        run: |
          ASSETS="dist/caleoped-linux-amd64 dist/caleope-linux-amd64 dist/caleope-ui-linux-amd64 dist/poste-linux-amd64 dist/poste-windows-amd64.exe dist/poste-bureau-linux-amd64 dist/poste-bureau-windows-amd64.exe dist/poste.desktop dist/Poste-macos-arm64.app.zip dist/Poste-macos-amd64.app.zip dist/poste-macos-arm64 dist/poste-macos-amd64 dist/poste-bureau-macos-arm64 dist/poste-bureau-macos-amd64"
          MANQUANTS=""
          for f in ${ASSETS}; do [ -f "$f" ] || MANQUANTS="${MANQUANTS} $f"; done
          if [ -n "${MANQUANTS}" ]; then
            # Nommer les absents : une publication qui échoue sans dire lequel
            # des quinze fichiers manque coûte une demi-heure à chaque fois.
            echo "::error::fichiers attendus mais absents :${MANQUANTS}"
            ls -la dist/ || true
            exit 1
          fi

          if gh release view "${TAG}" &>/dev/null; then
            # Release existante — remplacer les assets sans interruption (pas de delete)
            # Évite le window où la release n'a aucun asset pendant la reconstruction
            for asset in ${ASSETS}; do
              gh release upload "${TAG}" "${asset}" --clobber
            done
            # Pour alpha-latest : mettre à jour le titre avec le nouveau commit
            if [[ "${TAG}" == "alpha-latest" ]]; then
              gh release edit "${TAG}" --title "${TITLE}"
            fi
          else
            gh release create "${TAG}" \
              --title "${TITLE}" \
              --notes "" \
              ${ASSETS}
          fi
