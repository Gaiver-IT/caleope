<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Caleope — Premier démarrage</title>
<style>
  :root { --bg:#0c0c0e; --bg2:#141418; --border:#26262e; --text:#e8e8ec; --text2:#a0a0aa; --text3:#6a6a76; --vio:#7c6cff; --ok:#3ecf8e; --err:#ff5c6c; --mono:ui-monospace,SFMono-Regular,Menlo,monospace; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:var(--mono); display:flex; align-items:center; justify-content:center; min-height:100vh; padding:20px; }
  .card { width:100%; max-width:460px; background:var(--bg2); border:1px solid var(--border); border-radius:10px; padding:26px; }
  h1 { font-size:16px; margin:0 0 4px; letter-spacing:1px; }
  .sub { font-size:11px; color:var(--text3); margin-bottom:18px; }
  label { display:block; font-size:10px; color:var(--text2); letter-spacing:.5px; margin:12px 0 4px; text-transform:uppercase; }
  input, select { width:100%; background:var(--bg); border:1px solid var(--border); color:var(--text); border-radius:6px; padding:9px 10px; font-family:var(--mono); font-size:12px; }
  input:focus, select:focus { outline:none; border-color:var(--vio); }
  .hint { font-size:9px; color:var(--text3); margin-top:3px; }
  button { width:100%; margin-top:20px; background:var(--vio); color:#fff; border:none; border-radius:6px; padding:11px; font-family:var(--mono); font-weight:700; font-size:12px; letter-spacing:.5px; cursor:pointer; }
  button:disabled { opacity:.5; cursor:default; }
  #msg { min-height:16px; font-size:11px; margin-top:12px; text-align:center; }
  .row2 { display:flex; gap:10px; }
  .row2 > div { flex:1; }
  .hide { display:none; }
</style>
</head>
<body>
  <div class="card">
    <h1>CALEOPE</h1>
    <div class="sub">Premier démarrage — configuration du serveur</div>

    <form id="f" onsubmit="return false">
      <label>Domaine de base</label>
      <input id="domain" placeholder="caleope.mondomaine.fr" autocomplete="off">
      <div class="hint">Les apps seront sur jellyfin.&lt;domaine&gt;, etc. (utilise une IP si tu n'as pas de domaine)</div>

      <label>Mode reverse proxy</label>
      <select id="proxy_mode" onchange="toggleEmail()">
        <option value="npm">NPM/Caddy en amont (Traefik reçoit du HTTP)</option>
        <option value="traefik">Traefik natif (gère HTTPS / Let's Encrypt)</option>
        <option value="standalone">Standalone (HTTP seul — LAN / hors-ligne)</option>
      </select>

      <div id="emailWrap" class="hide">
        <label>Email (Let's Encrypt)</label>
        <input id="email" placeholder="admin@mondomaine.fr" autocomplete="off">
      </div>

      <!-- Canal (stable/alpha) : figé par l'ISO au build (pack-info.json) — pas un choix ici. -->

      <div class="row2">
        <div>
          <label>Mot de passe interface</label>
          <input id="ui_password" type="password" autocomplete="new-password">
        </div>
        <div>
          <label>Mot de passe secrets</label>
          <input id="secrets_password" type="password" autocomplete="new-password">
          <div class="hint">Protège les secrets des apps. À noter — irrécupérable.</div>
        </div>
      </div>

      <button id="btn" onclick="submitSetup()">CONFIGURER &amp; DÉMARRER</button>
      <div id="msg"></div>
    </form>
  </div>

<script>
function toggleEmail(){
  document.getElementById('emailWrap').classList.toggle('hide',
    document.getElementById('proxy_mode').value !== 'traefik');
}
function v(id){ return (document.getElementById(id).value||'').trim(); }
async function submitSetup(){
  const msg = document.getElementById('msg'), btn = document.getElementById('btn');
  if(!v('domain') || !v('ui_password') || !v('secrets_password')){
    msg.style.color='var(--err)'; msg.textContent='Domaine et les 2 mots de passe sont requis.'; return;
  }
  btn.disabled = true;
  msg.style.color='var(--text3)'; msg.textContent='Configuration en cours (déploiement de Traefik + apps)…';
  try{
    const r = await fetch('/setup', { method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ domain:v('domain'), proxy_mode:v('proxy_mode'), email:v('email'),
        ui_password:v('ui_password'), secrets_password:v('secrets_password') }) });
    if(!r.ok){ const e=await r.json().catch(()=>({})); throw new Error(e.error||'Erreur'); }
    poll();
  }catch(e){ msg.style.color='var(--err)'; msg.textContent=e.message; btn.disabled=false; }
}
async function poll(){
  const msg = document.getElementById('msg');
  try{
    const r = await fetch('/setup/status'); const d = await r.json();
    if(!d.firstboot){ msg.style.color='var(--ok)'; msg.textContent='✓ Configuré ! Redirection…'; setTimeout(()=>location.href='/',1500); return; }
  }catch(_){}
  setTimeout(poll, 4000);
}
</script>
</body>
</html>
