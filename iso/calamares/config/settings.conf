# Séquence Calamares — installeur Caleope (guidé, façon Windows 11).
---
modules-search: [ local, /usr/lib/x86_64-linux-gnu/calamares/modules, /usr/lib/calamares/modules ]

instances:
- id:      caleope
  module:  shellprocess
  config:  shellprocess_caleope.conf

sequence:
- show:
  - welcome        # Bienvenue (brandé Caleope)
  - locale         # Fuseau / langue
  - keyboard       # Clavier (défaut fr)
  - partition      # Disque (auto : effacer + LVM, façon appliance)
  - users          # Compte administrateur
  - summary        # Récapitulatif avant install
- exec:
  - partition
  - mount
  - unpackfs       # Copie du système de base (squashfs → disque)
  - machineid
  - fstab
  - locale
  - keyboard
  - localecfg
  - luksbootkeyfile
  - users
  - displaymanager
  - networkcfg
  - hwclock
  - services-systemd
  - bootloader-config
  - grubcfg
  - bootloader
  - shellprocess@caleope   # ← installe Caleope dans le système cible
  - umount
- show:
  - finished       # Terminé → redémarrer

branding:      caleope
prompt-install: true
dont-chroot:    false
oem-setup:      false
disable-cancel: false
quit-at-end:    false
