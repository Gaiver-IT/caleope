# Utilisateurs Caleope — appliance : on pré-remplit et verrouille le nom complet,
# l'identifiant (user-caleope, requis par install.sh) et le nom de machine, pour
# que l'utilisateur n'ait QUE le mot de passe à saisir (assistance maximale).
---
userGroup:       users
defaultGroups:
    - cdrom
    - floppy
    - sudo
    - audio
    - dip
    - video
    - plugdev
    - netdev
    - lpadmin
    - scanner
    - bluetooth
autologinGroup:  autologin
sudoersGroup:    sudo
setRootPassword:  false

# Nom de machine : pré-rempli « caleope » (le champ hostname n'est pas gérable
# via presets dans cette version → on fixe le modèle par défaut).
hostname:
    location:       EtcFile
    writeHostsFile: true
    template:       "caleope"
    forbiddenNames: [ localhost ]

passwordRequirements:
    nonempty: true
    minLength: -1
    maxLength: -1
    libpwquality:
        - minlen=0
        - minclass=0

# Champs pré-remplis + verrouillés (editable: false) → seul le mot de passe reste.
presets:
    fullName:
        value:    "Caleope"
        editable: false
    loginName:
        value:    "user-caleope"
        editable: false
