# Étape « caleope » : installe Caleope dans le système cible après la copie du
# système de base. On NE lance PAS l'install lourde ici (Docker/systemd absents
# en chroot d'install) : on copie le payload et on active caleope-install.service,
# qui posera Docker + Caleope au 1er vrai boot, puis le wizard de config.
# (Même stratégie que le preseed netinst — cohérent.)
---
dontChroot: true
timeout: 600
script:
  - command: "mkdir -p @@ROOT@@/opt/caleope-install"
    timeout: 30
  - command: "sh -c 'cp -a /caleope/. @@ROOT@@/opt/caleope-install/ 2>/dev/null || cp -a /run/live/medium/caleope/. @@ROOT@@/opt/caleope-install/ 2>/dev/null || true'"
    timeout: 120
  - command: "sh -c 'chmod +x @@ROOT@@/opt/caleope-install/install.sh 2>/dev/null || true'"
    timeout: 30
  - command: "sh -c 'cp @@ROOT@@/opt/caleope-install/caleope-install.service @@ROOT@@/etc/systemd/system/caleope-install.service 2>/dev/null || true'"
    timeout: 30
  - command: "chroot @@ROOT@@ systemctl enable caleope-install.service"
    timeout: 60
