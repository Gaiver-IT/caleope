# preseed.cfg — installation Debian 13 (Trixie) pour Caleope, mode « TUI minimal ».
#
# Injecté dans l'initrd de l'ISO netinst (voir build.sh). L'installeur ne demande
# QUE l'essentiel (réseau, disque, mot de passe) ; tout le reste est automatique.
# Le 1er boot lance ensuite le wizard web (config depuis un autre poste, :8766).
#
# NB : le boot passe priority=medium (build.sh) → d-i pose les questions medium+
# non préseedées (réseau/disque/mot de passe) et automatise le reste.

### Localisation — automatique (aussi passée en paramètre de boot pour le tout début)
d-i debian-installer/locale        string fr_FR.UTF-8
d-i keyboard-configuration/xkb-keymap select fr

### Réseau — INTERACTIF (l'utilisateur configure : DHCP ou IP statique + hostname).
# Rien de préseedé → d-i lance l'étape réseau (essentiel serveur). Timeouts pour
# ne pas rester bloqué sur la détection.
d-i netcfg/dhcp_timeout            string 60
d-i netcfg/link_wait_timeout       string 30

### Miroir — automatique
d-i mirror/country                 string manual
d-i mirror/http/hostname           string deb.debian.org
d-i mirror/http/directory          string /debian
d-i mirror/http/proxy              string
d-i mirror/suite                   string trixie

### Comptes — root DÉSACTIVÉ (sudo via user-caleope). SEUL le mot de passe est demandé.
# Nom complet + identifiant fixés (user-caleope, requis par install.sh) ; mot de
# passe NON préseedé → d-i le demande, l'utilisateur définit le sien (sécurisé).
d-i passwd/root-login              boolean false
d-i passwd/user-fullname           string Caleope
d-i passwd/username                string user-caleope
d-i user-setup/allow-password-weak boolean true
d-i user-setup/encrypt-home        boolean false

### Horloge — automatique
d-i clock-setup/utc                boolean true
d-i time/zone                      string Europe/Paris
d-i clock-setup/ntp                boolean true

### Partitionnement — GUIDÉ (LVM, tout-en-un) mais l'utilisateur CHOISIT le disque
# et CONFIRME l'effacement (pas de wipe silencieux). Méthode/recette préseedées ;
# disque + confirmations laissés interactifs.
d-i partman-auto/method            string lvm
d-i partman-auto/choose_recipe     select atomic
d-i partman-auto-lvm/guided_size   string max

### apt — pas d'analyse d'autres CD/DVD (sinon prompt "scanner un autre support")
d-i apt-setup/cdrom/set-first      boolean false
d-i apt-setup/cdrom/set-next       boolean false
d-i apt-setup/cdrom/set-failed     boolean false
d-i apt-setup/disable-cdrom-entries boolean true
d-i cdrom-detect/eject             boolean true

### Base — minimale, sans bureau (automatique)
tasksel tasksel/first              multiselect ssh-server, standard
d-i pkgsel/include                 string openssh-server curl ca-certificates sudo gnupg apt-transport-https
d-i pkgsel/upgrade                 select safe-upgrade
popularity-contest popularity-contest/participate boolean false

### GRUB — automatique (sur le disque d'install)
d-i grub-installer/only_debian     boolean true
d-i grub-installer/bootdev         string default

### Fin d'install — pas de prompt de reboot
d-i finish-install/reboot_in_progress note

### late_command : préparer l'install Caleope (exécutée au 1er vrai boot)
# On NE lance PAS l'install lourde (Docker, services) dans le chroot d-i — elle
# échouerait faute de systemd. On copie le payload, on pose le service oneshot
# caleope-install.service, et on l'active. Au 1er démarrage, ce service lance
# install.sh --iso (base), puis le wizard caleope-firstboot (web/CLI).
d-i preseed/late_command string \
    mkdir -p /target/opt/caleope-install ; \
    cp -a /cdrom/caleope/. /target/opt/caleope-install/ 2>/dev/null || true ; \
    chmod +x /target/opt/caleope-install/install.sh 2>/dev/null || true ; \
    cp /cdrom/caleope/caleope-install.service /target/etc/systemd/system/caleope-install.service 2>/dev/null || true ; \
    in-target systemctl enable caleope-install.service || true
