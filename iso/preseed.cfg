# preseed.cfg — installation Debian 13 (Trixie) 100% automatisée pour Caleope
#
# Injecté dans l'initrd de l'ISO netinst (voir build.sh) → d-i le charge tout seul.
# Objectif : installer une base Debian minimale + lancer l'install Caleope, sans
# aucune interaction. Le 1er boot lance ensuite le wizard (web/CLI).

### Localisation
d-i debian-installer/locale        string fr_FR.UTF-8
d-i keyboard-configuration/xkb-keymap select fr

### Réseau (DHCP ; hostname fixé, l'utilisateur le changera au wizard)
d-i netcfg/choose_interface        select auto
d-i netcfg/get_hostname            string caleope
d-i netcfg/get_domain              string local
d-i netcfg/hostname                string caleope
# Ne pas bloquer si pas de DHCP (installe quand même)
d-i netcfg/dhcp_timeout            string 60
d-i netcfg/link_wait_timeout       string 30

### Miroir
d-i mirror/country                 string manual
d-i mirror/http/hostname           string deb.debian.org
d-i mirror/http/directory          string /debian
d-i mirror/http/proxy              string
d-i mirror/suite                   string trixie

### Comptes
# Root : mot de passe par défaut À CHANGER au 1er wizard. On préfère un user sudo.
d-i passwd/root-login              boolean true
d-i passwd/root-password           password ChangeMeCaleope!
d-i passwd/root-password-again     password ChangeMeCaleope!
d-i passwd/user-fullname           string Caleope
d-i passwd/username                string user-caleope
d-i passwd/user-password           password ChangeMeCaleope!
d-i passwd/user-password-again     password ChangeMeCaleope!
d-i user-setup/allow-password-weak boolean true
d-i user-setup/encrypt-home        boolean false

### Horloge
d-i clock-setup/utc                boolean true
d-i time/zone                      string Europe/Paris
d-i clock-setup/ntp                boolean true

### Partitionnement — disque entier, LVM, tout dans une partition (appliance)
d-i partman-auto/method            string lvm
d-i partman-auto/choose_recipe     select atomic
d-i partman-auto-lvm/guided_size   string max
d-i partman-lvm/device_remove_lvm  boolean true
d-i partman-md/device_remove_md    boolean true
d-i partman-lvm/confirm            boolean true
d-i partman-lvm/confirm_nooverwrite boolean true
d-i partman/choose_partition       select finish
d-i partman/confirm                boolean true
d-i partman/confirm_nooverwrite    boolean true
# Pas de swap séparé si peu de disque : recipe atomic gère

### apt — pas d'analyse d'autres CD/DVD (sinon prompt "scanner un autre support")
d-i apt-setup/cdrom/set-first      boolean false
d-i apt-setup/cdrom/set-next       boolean false
d-i apt-setup/cdrom/set-failed     boolean false
d-i apt-setup/disable-cdrom-entries boolean true
d-i cdrom-detect/eject             boolean true

### Base — minimale, sans bureau
tasksel tasksel/first              multiselect ssh-server, standard
d-i pkgsel/include                 string openssh-server curl ca-certificates sudo gnupg apt-transport-https
d-i pkgsel/upgrade                 select safe-upgrade
popularity-contest popularity-contest/participate boolean false

### GRUB
d-i grub-installer/only_debian     boolean true
d-i grub-installer/bootdev         string default

### Fin d'install — pas de reboot manuel
d-i finish-install/reboot_in_progress note

### late_command : préparer l'install Caleope (exécutée au 1er vrai boot)
# On NE lance PAS l'install lourde (Docker, services) dans le chroot d-i — elle
# échouerait faute de systemd. On se contente de : copier le payload, poser le
# service oneshot caleope-install.service, et l'activer. Au premier démarrage,
# ce service lance install.sh --iso (base), puis le wizard caleope-firstboot.
# Le payload (binaires + install.sh + store.tar.gz [+ images]) est copié dans
# /caleope/ sur l'ISO par build.sh, monté à /cdrom pendant l'install.
d-i preseed/late_command string \
    mkdir -p /target/opt/caleope-install ; \
    cp -a /cdrom/caleope/. /target/opt/caleope-install/ 2>/dev/null || true ; \
    chmod +x /target/opt/caleope-install/install.sh 2>/dev/null || true ; \
    cp /cdrom/caleope/caleope-install.service /target/etc/systemd/system/caleope-install.service 2>/dev/null || true ; \
    in-target systemctl enable caleope-install.service || true
