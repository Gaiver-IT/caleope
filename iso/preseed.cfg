# preseed.cfg — installation Debian 13 (Trixie) pour Caleope, mode « TUI minimal ».
#
# Injecté dans l'initrd de l'ISO netinst (voir build.sh). L'installeur ne demande
# que le strict minimum ; tout le reste est automatique. Le mot de passe et la
# config se font ensuite dans le WIZARD WEB (:8766), depuis un autre poste.
#
# NB : le boot passe priority=high (build.sh) → d-i enchaîne TOUTES les étapes
# sans aucune question : le disque système est choisi AUTOMATIQUEMENT (voir
# partman/early_command plus bas). Installation 100 % sans intervention.

### Localisation — automatique
d-i debian-installer/locale        string fr_FR.UTF-8
# Clavier FRANÇAIS (AZERTY) pour le SYSTÈME installé (console serveur).
d-i console-setup/ask_detect       boolean false
d-i keyboard-configuration/xkb-keymap select fr
d-i keyboard-configuration/layoutcode string fr
d-i keyboard-configuration/modelcode  string pc105
d-i keyboard-configuration/variantcode string
d-i keyboard-configuration/optionscode string

### Réseau — hostname « caleope » ; DHCP auto.
d-i netcfg/get_hostname            string caleope
d-i netcfg/get_domain              string local
d-i netcfg/hostname                string caleope
d-i netcfg/dhcp_timeout            string 60
d-i netcfg/link_wait_timeout       string 30

### Miroir — automatique
d-i mirror/country                 string manual
d-i mirror/http/hostname           string deb.debian.org
d-i mirror/http/directory          string /debian
d-i mirror/http/proxy              string
d-i mirror/suite                   string trixie

### Comptes — root DÉSACTIVÉ (sudo via user-caleope). Le mot de passe N'EST PAS
# demandé à l'install (mot de passe temporaire) → il se définit dans le WIZARD WEB
# au 1er démarrage (où l'utilisateur peut utiliser son gestionnaire de mots de passe).
d-i passwd/root-login              boolean false
d-i passwd/user-fullname           string Caleope
d-i passwd/username                string user-caleope
d-i passwd/user-password           password caleope
d-i passwd/user-password-again     password caleope
d-i user-setup/allow-password-weak boolean true
d-i user-setup/encrypt-home        boolean false

### Horloge — automatique (Europe/Paris)
d-i clock-setup/utc                boolean true
d-i time/zone                      string Europe/Paris
d-i clock-setup/ntp                boolean true

### Choix AUTOMATIQUE du disque système (aucun écran manuel, même en multi-disques).
# Règle : on préfère un SSD (rotational=0) ; à défaut le plus petit disque. Parmi la
# classe retenue, on prend le PLUS PETIT (l'OS va sur le petit disque rapide, les gros
# disques restent vierges → configurés en RAID data dans le wizard web au 1er boot).
# Plancher 10 Go : on ignore les disques trop petits pour l'OS. GRUB suit le même disque.
d-i partman/early_command string \
    sh -c 'best=""; bestcls=2; bestgb=0; for d in $(list-devices disk); do n=${d##*/}; sec=$(cat /sys/block/$n/size 2>/dev/null); [ -z "$sec" ] && sec=0; gb=$((sec/1953125)); rota=$(cat /sys/block/$n/queue/rotational 2>/dev/null || echo 1); [ "$gb" -lt 10 ] && continue; if [ "$rota" = 0 ]; then cls=0; else cls=1; fi; if [ -z "$best" ] || [ "$cls" -lt "$bestcls" ] || { [ "$cls" -eq "$bestcls" ] && [ "$gb" -lt "$bestgb" ]; }; then best=$d; bestcls=$cls; bestgb=$gb; fi; done; [ -z "$best" ] && best=$(list-devices disk | head -n1); debconf-set partman-auto/disk "$best"; debconf-set grub-installer/bootdev "$best"'

### Partitionnement — LVM tout-en-un sur le disque choisi ci-dessus, confirmations
# d'effacement AUTOMATIQUES → zéro interaction.
d-i partman-auto/method            string lvm
d-i partman-auto/choose_recipe     select atomic
d-i partman-auto-lvm/guided_size   string max
d-i partman-lvm/device_remove_lvm  boolean true
d-i partman-md/device_remove_md    boolean true
d-i partman-lvm/confirm            boolean true
d-i partman-lvm/confirm_nooverwrite boolean true
d-i partman/choose_partition       select finish
d-i partman/confirm                boolean true
d-i partman/confirm_nooverwrite    boolean true

### apt — pas d'analyse d'autres CD/DVD
d-i apt-setup/cdrom/set-first      boolean false
d-i apt-setup/cdrom/set-next       boolean false
d-i apt-setup/cdrom/set-failed     boolean false
d-i apt-setup/disable-cdrom-entries boolean true
d-i cdrom-detect/eject             boolean true

### Base — minimale, sans bureau. jq/wget/git/lsb-release requis TÔT par install.sh
# (check_offline_bundle utilise jq avant que install.sh installe ses prérequis).
tasksel tasksel/first              multiselect ssh-server, standard
d-i pkgsel/include                 string openssh-server curl ca-certificates sudo gnupg apt-transport-https jq wget git lsb-release mdadm btrfs-progs xfsprogs
d-i pkgsel/upgrade                 select safe-upgrade
popularity-contest popularity-contest/participate boolean false

### GRUB — automatique (sur le disque d'install)
d-i grub-installer/only_debian     boolean true
d-i grub-installer/bootdev         string default

### Fin d'install — pas de prompt de reboot
d-i finish-install/reboot_in_progress note

### late_command : copie le payload + active caleope-install.service (1er boot).
d-i preseed/late_command string \
    mkdir -p /target/opt/caleope-install ; \
    cp -a /cdrom/caleope/. /target/opt/caleope-install/ 2>/dev/null || true ; \
    chmod +x /target/opt/caleope-install/install.sh 2>/dev/null || true ; \
    cp /cdrom/caleope/caleope-install.service /target/etc/systemd/system/caleope-install.service 2>/dev/null || true ; \
    in-target systemctl enable caleope-install.service || true ; \
    mkdir -p /target/etc/systemd/system/multi-user.target.wants ; \
    ln -sf /etc/systemd/system/caleope-install.service /target/etc/systemd/system/multi-user.target.wants/caleope-install.service
